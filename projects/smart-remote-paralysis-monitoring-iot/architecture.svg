<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="t d"><title id="t">Smart Remote Monitoring Module — IoT architecture</title><desc id="d">Three-tier architecture: biomedical and environmental sensors feed Arduino Nano; ESP8266 sends data to ThingSpeak and SIM800L sends SMS alerts; caregivers and clinicians view remote dashboards.</desc><defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#183047}.head{font-size:25px;font-weight:700}.sub{font-size:17px}.small{font-size:15px}.teal{fill:#e5f7f4;stroke:#42a99b;stroke-width:2}.blue{fill:#eaf2ff;stroke:#6997d5;stroke-width:2}.gold{fill:#fff6e6;stroke:#d6a34c;stroke-width:2}.arrow{stroke:#52738b;stroke-width:3;fill:none;marker-end:url(#a)}</style><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 z" fill="#52738b"/></marker></defs><rect width="1200" height="650" rx="24" fill="#fff"/><text x="600" y="48" text-anchor="middle" class="head">SMART REMOTE MONITORING MODULE FOR PARALYSIS PATIENTS</text><text x="600" y="78" text-anchor="middle" class="sub">Three-tier IoT monitoring architecture</text><rect x="35" y="115" width="330" height="470" rx="18" fill="#f7fafc" stroke="#c5d4df"/><rect x="435" y="115" width="330" height="470" rx="18" fill="#f7fafc" stroke="#c5d4df"/><rect x="835" y="115" width="330" height="470" rx="18" fill="#f7fafc" stroke="#c5d4df"/><text x="200" y="152" text-anchor="middle" class="head">1. Sensing &amp; acquisition</text><text x="600" y="152" text-anchor="middle" class="head">2. Communication</text><text x="1000" y="152" text-anchor="middle" class="head">3. Cloud &amp; application</text><rect class="teal" x="70" y="180" width="260" height="190" rx="14"/><text x="200" y="212" text-anchor="middle" class="sub" font-weight="700">Biomedical / environment</text><text x="92" y="250" class="small">• IMU / accelerometer</text><text x="92" y="280" class="small">• AD8232 ECG sensor</text><text x="92" y="310" class="small">• Pulse / heart-rate sensor</text><text x="92" y="340" class="small">• Body temperature + DHT11</text><rect class="blue" x="90" y="405" width="220" height="105" rx="14"/><text x="200" y="445" text-anchor="middle" class="head">Arduino Nano</text><text x="200" y="475" text-anchor="middle" class="small">Read • filter • threshold-check</text><path class="arrow" d="M200 370 V402"/><rect class="blue" x="475" y="205" width="250" height="115" rx="14"/><text x="600" y="248" text-anchor="middle" class="head">ESP8266 NodeMCU</text><text x="600" y="280" text-anchor="middle" class="small">Wi-Fi / UART data link</text><rect class="gold" x="475" y="390" width="250" height="115" rx="14"/><text x="600" y="433" text-anchor="middle" class="head">SIM800L GSM</text><text x="600" y="465" text-anchor="middle" class="small">SMS alert to caregivers</text><path class="arrow" d="M310 440 H390 V262 H472"/><path class="arrow" d="M310 470 H400 V447 H472"/><rect class="blue" x="875" y="205" width="250" height="115" rx="14"/><text x="1000" y="248" text-anchor="middle" class="head">ThingSpeak cloud</text><text x="1000" y="280" text-anchor="middle" class="small">Store • visualize • review trends</text><rect class="teal" x="875" y="390" width="250" height="115" rx="14"/><text x="1000" y="433" text-anchor="middle" class="head">Caregiver / clinician</text><text x="1000" y="465" text-anchor="middle" class="small">Web / mobile dashboard</text><path class="arrow" d="M725 262 H872"/><path class="arrow" d="M725 447 H800 V500 H872"/><path class="arrow" d="M1000 320 V387"/><text x="600" y="625" text-anchor="middle" class="small">Prototype concept from the submitted major-project report • not a medical diagnostic device</text></svg>